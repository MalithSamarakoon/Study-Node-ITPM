spring.application.name=backend
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:studynode_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:admin}

server.port=${SERVER_PORT:8080}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.packages-to-scan=com.studynode.backend.teamup.entity
app.storage.root=${APP_STORAGE_ROOT:uploads}
