spring.application.name=backend

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:studynode_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

studynode.app.jwtSecret=${JWT_SECRET:StudyNodeJwtSecretKeyAtLeast32Chars!}
studynode.app.jwtExpirationMs=${JWT_EXPIRATION:86400000}

server.port=${SERVER_PORT:8081}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true