spring.application.name=backend

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:studynode_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

studynode.app.jwtSecret=472D4B6150645367566B5970337336763979244226452948404D635166546A57
studynode.app.jwtExpirationMs=86400000

server.port=${SERVER_PORT:8080}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# File upload storage root (can be overridden in .env)
app.storage.root=${STORAGE_ROOT:./uploads}

# Allow large file uploads for video resources
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=250MB
