spring.application.name=backend
server.port=8080
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/studynode_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:admin}

studynode.app.jwtSecret=${JWT_SECRET:StudyNodeLocalJwtSecretKeyForDevOnly1234567890}
studynode.app.jwtExpirationMs=${JWT_EXPIRATION:86400000}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.packages-to-scan=org.practicals.backend.model,com.studynode.backend.teamup.entity
spring.jpa.properties.hibernate.format_sql=true

app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173}

# File upload storage root (can be overridden in .env)
app.storage.root=${STORAGE_ROOT:./uploads}

# Allow large file uploads for video resources
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=250MB
