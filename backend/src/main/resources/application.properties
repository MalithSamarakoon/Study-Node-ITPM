spring.application.name=backend
spring.datasource.url=jdbc:mysql://localhost:3306/studynode_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=1234

studynode.app.jwtSecret=${JWT_SECRET}
studynode.app.jwtExpirationMs=${JWT_EXPIRATION}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# File upload storage root (can be overridden in .env)
app.storage.root=${STORAGE_ROOT:./uploads}

# Allow large file uploads for video resources
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=250MB

